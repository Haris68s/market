<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moderasi Produk &mdash; Panel Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/dashboard.css">
</head>
<body>
  <div id="app-header"></div>

  <div class="dash-layout">
    <aside class="dash-side" id="dash-side"></aside>

    <main class="dash-main">
      <div class="dash-head">
        <div>
          <h1>Moderasi Produk</h1>
          <p>Tinjau dan sembunyikan produk yang melanggar aturan.</p>
        </div>
      </div>

      <div class="dash-toolbar">
        <div class="field" style="flex:1 1 220px">
          <label class="label" for="q">Cari produk</label>
          <input class="input" type="search" id="q" maxlength="120" placeholder="Nama produk...">
        </div>
        <div class="field">
          <label class="label" for="filter-status">Status</label>
          <select class="select" id="filter-status">
            <option value="all">Semua status</option>
            <option value="active">Aktif</option>
            <option value="draft">Draft</option>
            <option value="out_of_stock">Habis</option>
            <option value="hidden">Disembunyikan</option>
          </select>
        </div>
      </div>

      <section class="card">
        <div class="card-head">
          <h2>Daftar Produk</h2>
          <span class="muted small" id="jumlah-produk"></span>
        </div>
        <div class="card-body" id="daftar-produk"></div>
      </section>
    </main>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/admin-common.js"></script>
  <script src="/assets/js/admin/produk.js"></script>
</body>
</html>
