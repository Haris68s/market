<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk &mdash; KantinSiswa</title>
  <meta name="description" content="Masuk ke akun KantinSiswa untuk mengelola toko, pesanan, dan keuangan.">
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/public.css">
</head>
<body>
  <div id="app-header"></div>

  <main class="auth-wrap">
    <div class="auth-card">
      <div class="auth-head">
        <a class="brand" href="/">
          <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#shopping-bag"></use></svg></span>
          <span class="brand-text">KantinSiswa<small>Marketplace Siswa</small></span>
        </a>
        <h1>Masuk ke akunmu</h1>
        <p>Gunakan nomor WhatsApp yang terdaftar.</p>
      </div>

      <div id="login-error"></div>

      <form id="form-login" novalidate>
        <div class="field">
          <label class="label" for="whatsapp">Nomor WhatsApp <span class="req">*</span></label>
          <input class="input" type="tel" id="whatsapp" name="whatsapp" inputmode="numeric"
                 autocomplete="username" placeholder="081234567890" required>
          <p class="error-text" data-error-for="whatsapp"></p>
          <p class="hint">Format bebas: 08xxx, +628xxx, atau 628xxx.</p>
        </div>

        <div class="field">
          <label class="label" for="password">Password <span class="req">*</span></label>
          <input class="input" type="password" id="password" name="password"
                 autocomplete="current-password" placeholder="Masukkan password" required>
          <p class="error-text" data-error-for="password"></p>
        </div>

        <button class="btn btn-primary btn-lg btn-block" type="submit" id="btn-masuk">Masuk</button>
      </form>

      <div class="auth-footer">
        Belum punya toko? <a href="/daftar.html">Daftar sebagai penjual</a><br>
        <a href="/lupa-password.html" class="tiny">Lupa password?</a>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/auth.js"></script>
</body>
</html>
