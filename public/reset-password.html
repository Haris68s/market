<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password &mdash; KantinSiswa</title>
  <meta name="description" content="Buat password baru untuk akun KantinSiswa.">
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/public.css">
</head>
<body>
  <div id="app-header"></div>

  <main class="auth-wrap">
    <div class="auth-card">
      <div class="auth-head">
        <h1>Buat password baru</h1>
        <p>Masukkan kode reset yang kamu terima dari admin.</p>
      </div>

      <div id="reset-result"></div>

      <form id="form-reset" novalidate>
        <div class="field">
          <label class="label" for="token">Kode reset <span class="req">*</span></label>
          <input class="input" type="text" id="token" name="token" placeholder="Kode dari admin" required>
          <p class="error-text" data-error-for="token"></p>
        </div>

        <div class="field">
          <label class="label" for="newPassword">Password baru <span class="req">*</span></label>
          <input class="input" type="password" id="newPassword" name="newPassword"
                 autocomplete="new-password" placeholder="Minimal 8 karakter" required>
          <p class="error-text" data-error-for="newPassword"></p>
        </div>

        <div class="field">
          <label class="label" for="newPasswordConfirm">Ulangi password baru <span class="req">*</span></label>
          <input class="input" type="password" id="newPasswordConfirm" name="newPasswordConfirm"
                 autocomplete="new-password" placeholder="Ketik ulang password" required>
          <p class="error-text" data-error-for="newPasswordConfirm"></p>
        </div>

        <button class="btn btn-primary btn-lg btn-block" type="submit" id="btn-reset">Simpan password baru</button>
      </form>

      <div class="auth-footer">
        <a href="/masuk.html">Kembali ke halaman masuk</a>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/reset.js"></script>
</body>
</html>
